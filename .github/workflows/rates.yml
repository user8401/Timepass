name: Update gold rates
on:
  schedule:
    - cron: "5 4-15 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: python fetch_rates.py
      - run: |
          git config user.name "rates-bot"
          git config user.email "bot@users.noreply.github.com"
          git add rates.json
          git commit -m "Update rates" || exit 0
          git push
